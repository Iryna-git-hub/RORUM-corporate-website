          - text: "Website: ro-rum.dk"
        - heading "2. Use of this website" [level=2] [ref=f23e100]
        - paragraph [ref=f23e101]: This website provides information about RORUM, events, hosted gatherings, catering, event decoration and related community experiences. The website is intended for general information and inquiries.
        - heading "3. Inquiries and forms" [level=2] [ref=f23e102]
        - paragraph [ref=f23e103]: Forms on this website are email-only. Submitting a form sends your inquiry to RORUM by email. Form submissions are not stored in Sanity, and no inquiry database is used in this simplified setup.
        - heading "4. Bookings and tickets" [level=2] [ref=f23e104]
        - paragraph [ref=f23e105]: Submitting an inquiry does not create a confirmed booking. Details such as availability, pricing and final arrangements are confirmed separately. Event ticket purchases may be handled through Billetto, which is an external ticket provider.
        - heading "5. External links and services" [level=2] [ref=f23e106]
        - paragraph [ref=f23e107]: This website may link to external services, including Billetto, Google Maps and social media platforms. RORUM is not responsible for the content, policies or technical behavior of external websites.
        - heading "6. Website content" [level=2] [ref=f23e108]
        - paragraph [ref=f23e109]: All text, images, design elements and website content belong to RORUM or are used with permission. You may not copy, reuse or distribute website content without permission from RORUM.
        - heading "7. Website availability" [level=2] [ref=f23e110]
        - paragraph [ref=f23e111]: RORUM aims to keep the website available and accurate, but the website may change, be unavailable or contain errors from time to time.
        - heading "8. Contact" [level=2] [ref=f23e112]
        - paragraph [ref=f23e113]: For questions about these terms, contact hello@rorum.dk.
