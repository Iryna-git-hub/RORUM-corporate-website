          - generic [ref=f7e92]:
            - paragraph [ref=f7e93]: It often starts with something simple — a conversation, a shared idea, a moment that brings people together.
            - paragraph [ref=f7e94]: At RORUM, these moments turn into experiences. And experiences turn into community.
            - paragraph [ref=f7e95]: Volunteering here is more than helping at events. It's becoming part of a space where people create, connect, and grow side by side.
            - paragraph [ref=f7e96]: You might be welcoming guests, supporting a workshop, or simply helping shape the atmosphere — but along the way, you become part of something real.
          - generic [ref=f7e97]:
