            - paragraph [ref=f7e111]: Support each other.
            - paragraph [ref=f7e118]: Build something together.
          - generic [ref=f7e119]:
            - paragraph [ref=f7e120]: In return, you gain experience, meet inspiring people, and become part of an international creative community in the heart of Copenhagen.
            - paragraph [ref=f7e121]: If you feel a spark reading this — it probably means you belong here.
