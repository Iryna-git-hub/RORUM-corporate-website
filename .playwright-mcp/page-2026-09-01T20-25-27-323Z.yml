    - main [ref=f24e84]:
      - generic [ref=f24e87]:
        - generic [ref=f24e88]: LEGAL
        - heading "Vilkår og betingelser" [level=1] [ref=f24e89]
        - paragraph [ref=f24e90]: Vilkår for brug af RORUM-hjemmesiden, indsendelse af forespørgsler og brug af eksterne billetlinks.
        - paragraph [ref=f24e91]: "Sidst opdateret: maj 2026"
      - generic [ref=f24e94]:
        - heading "1. Company details" [level=2] [ref=f24e95]
        - paragraph [ref=f24e96]: RORUM is a Copenhagen-based business connected to events, private meetings, catering, event decoration and community experiences.
        - paragraph [ref=f24e97]:
          - strong [ref=f24e98]: RORUM
          - text: "Address: Buermistersgade 26, 1 th, CopenhagenCVR: 46033213Contact:"
          - link "rorum2025@gmail.com" [ref=f24e99] [cursor=pointer]:
            - /url: mailto:rorum2025@gmail.com
          - text: "Website: ro-rum.dk"
        - heading "2. Brug af denne hjemmeside" [level=2] [ref=f24e100]
        - paragraph [ref=f24e101]: Denne hjemmeside giver information om RORUM, events, værtsledede sammenkomster, catering, eventdekoration og relaterede fællesskabsoplevelser. Hjemmesiden er beregnet til generel information og forespørgsler.
        - heading "3. Forespørgsler og formularer" [level=2] [ref=f24e102]
        - paragraph [ref=f24e103]: Formularer på denne hjemmeside er kun via e-mail. At indsende en formular sender din forespørgsel til RORUM pr. e-mail. Formularindsendelser gemmes ikke i Sanity, og ingen forespørgselsdatabase anvendes i denne forenklede opsætning.
        - heading "4. Bookinger og billetter" [level=2] [ref=f24e104]
        - paragraph [ref=f24e105]: At indsende en forespørgsel skaber ikke en bekræftet booking. Detaljer som tilgængelighed, pris og endelige aftaler bekræftes separat. Køb af eventbilletter kan foregå via Billetto, som er en ekstern billetudbyder.
        - heading "5. Eksterne links og tjenester" [level=2] [ref=f24e106]
        - paragraph [ref=f24e107]: Denne hjemmeside kan linke til eksterne tjenester, herunder Billetto, Google Maps og sociale medieplatforme. RORUM er ikke ansvarlig for indhold, politikker eller teknisk adfærd på eksterne hjemmesider.
        - heading "6. Hjemmesideindhold" [level=2] [ref=f24e108]
        - paragraph [ref=f24e109]: Alt tekst, billeder, designelementer og hjemmesideindhold tilhører RORUM eller anvendes med tilladelse. Du må ikke kopiere, genbruge eller distribuere hjemmesideindhold uden tilladelse fra RORUM.
        - heading "7. Hjemmesidens tilgængelighed" [level=2] [ref=f24e110]
        - paragraph [ref=f24e111]: RORUM sigter mod at holde hjemmesiden tilgængelig og korrekt, men hjemmesiden kan til tider ændre sig, være utilgængelig eller indeholde fejl.
        - heading "8. Kontakt" [level=2] [ref=f24e112]
        - paragraph [ref=f24e113]: For spørgsmål om disse vilkår, kontakt hello@rorum.dk.
